<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        video { 
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; 
            object-fit: cover; opacity: 0; transition: opacity 0.5s; 
        }
        .active { opacity: 1; z-index: 10; }
    </style>
</head>
<body>
    <video id="video1" muted playsinline preload="auto"></video>
    <video id="video2" muted playsinline preload="auto"></video>

<script>
    const playlist = [
        "https://www.dropbox.com/scl/fi/p3jnpcnq5zq0i00y423lj/.mp4?rlkey=c87u2tmn8amluocftqtn792cl&st=d1wh4tew&raw=1",
        "https://www.dropbox.com/scl/fi/v2bx6rptchmopoyj2wg84/.mp4?rlkey=a8d5xdh97r1k0b5y1p06mmvkr&st=05anps8s&raw=1"
    ];

    let currentIndex = 0;
    const players = [document.getElementById('video1'), document.getElementById('video2')];
    let activePlayerIndex = 0;

    function prepareNext(player, index) {
        player.src = playlist[index];
        player.load();
    }

    function switchPlayers() {
        const currentPlayer = players[activePlayerIndex];
        const nextPlayerIndex = 1 - activePlayerIndex;
        const nextPlayer = players[nextPlayerIndex];

        // შემდეგი ვიდეოს გაშვება
        nextPlayer.play().then(() => {
            nextPlayer.classList.add('active');
            currentPlayer.classList.remove('active');
            
            // ვამზადებთ შემდეგ ვიდეოს შემდეგი ციკლისთვის
            activePlayerIndex = nextPlayerIndex;
            currentIndex = (currentIndex + 1) % playlist.length;
            prepareNext(currentPlayer, currentIndex);
        });
    }

    // პირველი გაშვება
    players[0].src = playlist[0];
    players[0].classList.add('active');
    players[0].play();
    
    // მეორე ფლეიერის წინასწარ მომზადება
    currentIndex = (currentIndex + 1) % playlist.length;
    prepareNext(players[1], currentIndex);

    // როცა ვიდეო მთავრდება, გადავრთავთ
    players[0].onended = switchPlayers;
    players[1].onended = switchPlayers;

</script>
</body>
</html>
