<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; cursor: none; }
        video { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; opacity: 0; }
        .active { opacity: 1; z-index: 10; }
    </style>
</head>
<body>
    <video id="v1" muted playsinline></video>
    <video id="v2" muted playsinline></video>

<script>
    const playlist = [
        "https://www.dropbox.com/scl/fi/p3jnpcnq5zq0i00y423lj/.mp4?rlkey=c87u2tmn8amluocftqtn792cl&st=d1wh4tew&dl=1",
        "https://www.dropbox.com/scl/fi/v2bx6rptchmopoyj2wg84/.mp4?rlkey=a8d5xdh97r1k0b5y1p06mmvkr&st=05anps8s&dl=1"
    ];

    let currentIndex = 0;
    const players = [document.getElementById('v1'), document.getElementById('v2')];
    let activeIdx = 0;

    // მთავარი ფუნქცია: ვიდეოს სრულიად ჩამოტვირთვა მეხსიერებაში
    async function loadVideoToMemory(url) {
        try {
            const response = await fetch(url);
            const blob = await response.blob(); // აი აქ იწერს ფაილს სრულად RAM-ში
            return URL.createObjectURL(blob);
        } catch (e) {
            console.log("ინტერნეტი არ არის, ვცდილობთ ქეშიდან...", e);
            return url; // fallback
        }
    }

    async function swap() {
        const current = players[activeIdx];
        activeIdx = 1 - activeIdx;
        const next = players[activeIdx];

        next.play();
        next.classList.add('active');
        current.classList.remove('active');

        // სანამ ერთი ტრიალებს, შემდეგს ვტვირთავთ მეხსიერებაში
        currentIndex = (currentIndex + 1) % playlist.length;
        const blobUrl = await loadVideoToMemory(playlist[currentIndex]);
        current.src = blobUrl;
        current.load();
    }

    async function init() {
        // პირველი ვიდეოს მომზადება
        const firstUrl = await loadVideoToMemory(playlist[0]);
        players[0].src = firstUrl;
        players[0].classList.add('active');
        players[0].play();

        // მეორე ვიდეოს მომზადება ფონზე
        const secondUrl = await loadVideoToMemory(playlist[1]);
        players[1].src = secondUrl;
        
        players[0].onended = swap;
        players[1].onended = swap;
    }

    init();
</script>
</body>
</html>
