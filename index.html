<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>Molscreen Player</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        video { width: 100vw; height: 100vh; object-fit: cover; }
    </style>
</head>
<body>
    <video id="player" autoplay muted playsinline></video>

<script>
    // Service Worker-ის რეგისტრაცია
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js?v=10');
    }

    const videoElement = document.getElementById('player');
    const playlist = [
        "https://raw.githubusercontent.com/lukamikautadze/Mallscreen/main/video1.mp4",
        "https://raw.githubusercontent.com/lukamikautadze/Mallscreen/main/video2.mp4"
    ];
    
    let index = 0;

    function playNext() {
        if (index >= playlist.length) index = 0;
        videoElement.src = playlist[index];
        videoElement.load();
        videoElement.play().catch(e => console.log("Play error:", e));
        index++;
    }

    videoElement.onended = playNext;

    // პირველი გაშვება
    playNext();
</script>
</body>
</html>
