<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
    <title>Molscreen Player</title>
    <style>
        html,body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            cursor: none;
        }

        #player-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.6s ease-in-out;
        }

        .hidden { opacity: 0; z-index: 1; pointer-events: none; }
        .visible { opacity: 1; z-index: 2; }
    </style>
</head>
<body>
    <div id="player-container">
        <video id="video1" class="visible" autoplay muted playsinline></video>
        <video id="video2" class="hidden" muted playsinline></video>
    </div>

    <script>
        // Playlist - put your uploaded video URLs here
        const playlist = [
            "https://www.dropbox.com/scl/fi/v2bx6rptchmopoyj2wg84/.mp4?rlkey=a8d5xdh97r1k0b5y1p06mmvkr&st=zzu8cfyl&raw=1",
            "https://www.dropbox.com/scl/fi/p3jnpcnq5zq0i00y423lj/.mp4?rlkey=c87u2tmn8amluocftqtn792cl&st=nedpyc82&raw=1"
        ];

        const CACHE_NAME = 'molscreen-v2';
        let currentIndex = 0;
        const videos = [document.getElementById('video1'), document.getElementById('video2')];
        let activeVideoIndex = 0;

        // Keep track of blob URLs we create so we can revoke them later and avoid leaks
        const blobUrlMap = new Map();

        async function cacheAndGetBlobUrl(url) {
            try {
                const cache = await caches.open(CACHE_NAME);
                // Normalize request so cache keys match network requests
                const request = new Request(url, {mode: 'cors', credentials: 'omit'});
                const cached = await cache.match(request);
                if (cached) {
                    const blob = await cached.blob();
                    const blobUrl = URL.createObjectURL(blob);
                    blobUrlMap.set(url, blobUrl);
                    return blobUrl;
                }

                // Not cached — fetch from network and cache fully
                const response = await fetch(request);
                if (response && (response.status === 200 || response.status === 206)) {
                    // Clone because we need one copy for cache and one to read as blob
                    await cache.put(request, response.clone());
                    const blob = await response.blob();
                    const blobUrl = URL.createObjectURL(blob);
                    blobUrlMap.set(url, blobUrl);
                    return blobUrl;
                }
            } catch (e) {
                console.warn('cacheAndGetBlobUrl failed for', url, e);
            }
            // Fallback to original URL if anything goes wrong
            return url;
        }

        async function setupVideo(videoElement, index, isInitial = false) {
            const url = playlist[index];
            // Try to get blob URL from cache (or fetch+cache)
            const source = await cacheAndGetBlobUrl(url);
            videoElement.src = source;
            videoElement.load();
            if (isInitial) {
                try { await videoElement.play(); } catch (e) { /* autoplay blocked */ }
            }
        }

        async function swapVideos() {
            const currentVideo = videos[activeVideoIndex];
            activeVideoIndex = 1 - activeVideoIndex;
            const nextVideo = videos[activeVideoIndex];

            // ensure nextVideo has the next index's source
            const nextIndex = (currentIndex + 1) % playlist.length;
            await setupVideo(nextVideo, nextIndex);

            nextVideo.play().then(() => {
                nextVideo.classList.remove('hidden');
                nextVideo.classList.add('visible');
                currentVideo.classList.remove('visible');
                currentVideo.classList.add('hidden');

                // cleanup previous blob URL after transition to free memory
                setTimeout(() => {
                    const previousUrl = currentVideo.src;
                    // If previousUrl is a blob URL we created, revoke it
                    for (const [key, val] of blobUrlMap.entries()) {
                        if (val === previousUrl) {
                            URL.revokeObjectURL(val);
                            blobUrlMap.delete(key);
                            break;
                        }
                    }

                    try {
                        currentVideo.src = "";
                        currentVideo.load();
                    } catch (e) {/* ignore */}
                }, 1000);

                currentIndex = (currentIndex + 1) % playlist.length;
                // prepare following video
                const followingIndex = (currentIndex + 1) % playlist.length;
                setupVideo(currentVideo, followingIndex);
            }).catch(() => {
                // if next video couldn't play, retry shortly
                setTimeout(swapVideos, 2000);
            });
        }

        async function initPlayer() {
            // Start caching and play first video as blob so it works offline
            await setupVideo(videos[0], 0, true);
            // preload next video as blob
            setupVideo(videos[1], 1);

            videos[0].onended = swapVideos;
            videos[1].onended = swapVideos;

            // In the background ensure all playlist items are cached for offline playback
            cacheEntirePlaylist();
        }

        async function cacheEntirePlaylist() {
            try {
                const cache = await caches.open(CACHE_NAME);
                for (const url of playlist) {
                    const request = new Request(url, {mode: 'cors', credentials: 'omit'});
                    const matched = await cache.match(request);
                    if (!matched) {
                        try {
                            const res = await fetch(request);
                            if (res && (res.status === 200 || res.status === 206)) {
                                await cache.put(request, res.clone());
                            }
                        } catch (e) { console.warn('Failed to fetch for caching', url, e); }
                    }
                }
            } catch (e) {
                console.warn('cacheEntirePlaylist failed', e);
            }
        }

        window.onload = initPlayer;

        // Register service worker for broader offline support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                .then(() => console.log('SW Registered'))
                .catch(() => console.log('SW Registration failed'));
            });
        }
    </script>
</body>
</html>
