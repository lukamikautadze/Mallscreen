<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>Molscreen Offline Player</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        video { width: 100vw; height: 100vh; object-fit: cover; }
    </style>
</head>
<body>
    <video id="player" autoplay muted playsinline></video>

<script>
    // 1. რეგისტრაცია Service Worker-ის (ოფლაინ რეჟიმისთვის)
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }

    const videoElement = document.getElementById('player');
    const playlist = [
        "https://www.dropbox.com/scl/fi/fdey9od9eii498lsanwt6/Video-lyriced-by-kirkitaa7-music-lyricedits-k...-7594790642086087943.mp4?rlkey=5f5bv46xlacc7wrr0rgjqlnis&st=ooubh7e6&dl=0", 
        "https://www.dropbox.com/scl/fi/15wx1gsxro91i7dnv42wz/KFC.mp4?rlkey=e6sn7glqwf2hl4bsqb1eve0f0&st=15baqphh&dl=0"
    ];
    let index = 0;

    function playVideo() {
        if (index >= playlist.length) index = 0;
        videoElement.src = playlist[index];
        videoElement.play();
        index++;
    }

    videoElement.onended = playVideo;
    playVideo();
</script>
</body>
</html>
