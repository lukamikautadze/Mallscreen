<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; cursor: none; }
        video { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: white; z-index: 100; display: flex; align-items: center; justify-content: center; font-size: 30px; font-family: sans-serif; cursor: pointer; }
    </style>
</head>
<body>
    <div id="overlay" onclick="startApp()">დააჭირე OK / Press OK</div>
    <video id="player" muted playsinline></video>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }

    // პირდაპირ გითჰაბის ლინკები მაქვს ატვირთული
    const playlist = [
        "https://raw.githubusercontent.com/lukamikautadze/Mallscreen/main/video1.mp4",
        "https://raw.githubusercontent.com/lukamikautadze/Mallscreen/main/video2.mp4"
    ];

    let current = 0;
    const player = document.getElementById('player');

    function startApp() {
        document.getElementById('overlay').style.display = 'none';
        playVideo();
    }

    function playVideo() {
        player.src = playlist[current];
        player.play().catch(e => console.log("Error:", e));
        
        player.onended = () => {
            current = (current + 1) % playlist.length;
            playVideo();
        };
    }

    window.addEventListener('keydown', (e) => { if(e.keyCode === 13) startApp(); });
</script>
</body>
</html>
