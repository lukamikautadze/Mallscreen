<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>Molscreen Offline Pro</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        video { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; display: none; }
        .active { display: block; }
        #status { position: fixed; bottom: 10px; left: 10px; color: rgba(255,255,255,0.3); font-family: sans-serif; font-size: 12px; z-index: 100; }
    </style>
</head>
<body>
    <div id="status">ჩატვირთვა...</div>
    <video id="player1" muted playsinline></video>
    <video id="player2" muted playsinline></video>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').then(() => console.log("SW Registered"));
    }

    const playlist = [
        "https://www.dropbox.com/scl/fi/p3jnpcnq5zq0i00y423lj/.mp4?rlkey=c87u2tmn8amluocftqtn792cl&st=d1wh4tew&raw=1",
        "https://www.dropbox.com/scl/fi/v2bx6rptchmopoyj2wg84/.mp4?rlkey=a8d5xdh97r1k0b5y1p06mmvkr&st=05anps8s&raw=1"
    ];

    const players = [document.getElementById('player1'), document.getElementById('player2')];
    let currentPlayerIndex = 0;
    let currentVideoIndex = 0;
    const statusIdx = document.getElementById('status');

    function initPlayer(player, url) {
        player.src = url;
        player.load();
    }

    async function switchPlayers() {
        const nextPlayerIndex = (currentPlayerIndex + 1) % 2;
        const currentPlayer = players[currentPlayerIndex];
        const nextPlayer = players[nextPlayerIndex];

        currentVideoIndex = (currentVideoIndex + 1) % playlist.length;
        
        statusIdx.innerText = "Playing video " + (currentVideoIndex + 1);
        
        nextPlayer.classList.add('active');
        try {
            await nextPlayer.play();
            currentPlayer.classList.remove('active');
            currentPlayer.pause();
            
            // შემდეგი ვიდეოს წინასწარ მომზადება (Preload)
            const nextVideoUrl = playlist[(currentVideoIndex + 1) % playlist.length];
            initPlayer(currentPlayer, nextVideoUrl);
            currentPlayerIndex = nextPlayerIndex;
        } catch (e) {
            console.error("Play failed", e);
            setTimeout(switchPlayers, 1000);
        }
    }

    players[0].onended = switchPlayers;
    players[1].onended = switchPlayers;

    // სტარტი
    initPlayer(players[0], playlist[0]);
    initPlayer(players[1], playlist[1]);
    
    players[0].classList.add('active');
    players[0].play().then(() => {
        statusIdx.innerText = "Online/Offline Ready";
    });
</script>
</body>
</html>
